.list{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.op-card{cursor:pointer}

}
function renderOpDetail(){
 const op=OPS.find(o=>o.id===selectedOpId); if(!op){document.getElementById("opDetail").innerHTML="";return;}
 document.getElementById("opDetail").innerHTML=`<div class="card"><h3>${op.name} <span class="tag">${op.role}</span></h3><p class="hint">${op.id}</p><h4>Best Loadout</h4><p><b>Primary:</b> ${op.primary}<br><span class="hint">Attachments: ${op.primaryAttachments.join(", ")||"—"}</span></p><p><b>Secondary:</b> ${op.secondary||"—"}<br><span class="hint">Attachments: ${op.secondaryAttachments.join(", ")||"—"}</span></p><p><b>Gadgets:</b> ${op.gadgets.join(", ")}</p><h4>Add Variation</h4><div class="grid"><div><input id="vPrimary" placeholder="Primary"></div><div><input id="vSecondary" placeholder="Secondary"></div><div><input id="vGadgets" placeholder="Gadgets comma"></div><div><input id="vAttach" placeholder="Attachments comma"></div></div><button class="primary" onclick="addVariation()">Add variation</button><h4>Community Variations</h4><div id="varList"></div></div>`;
 renderVariations();
}
function renderVariations(){
 const list=state.loadouts.filter(l=>l.operatorId===selectedOpId);
 const container=document.getElementById("varList"); if(!container)return;
 if(list.length===0){container.innerHTML=`<div class="hint">No variations yet</div>`;return;}
 container.innerHTML=list.sort((a,b)=>(state.votes[b.id]||0)-(state.votes[a.id]||0)).map(l=>`<div class="card"><strong>${l.primary}</strong> ${l.secondary?"/ "+l.secondary:""}<div class="hint">Gadgets: ${l.gadgets.join(", ")} Attachments: ${l.attachments.join(", ")}</div><div><button onclick="vote('${l.id}',1)">▲</button><span>${state.votes[l.id]||0}</span><button onclick="vote('${l.id}',-1)">▼</button> <span class="hint">by ${l.author}</span></div></div>`).join("");
}
function addVariation(){
 if(!state.user){alert("Sign in first");return;}
 const primary=document.getElementById("vPrimary").value; if(!primary)return;
 const loadout={id:"l"+Date.now(),operatorId:selectedOpId,primary,secondary:document.getElementById("vSecondary").value,gadgets:document.getElementById("vGadgets").value.split(",").map(s=>s.trim()).filter(Boolean),attachments:document.getElementById("vAttach").value.split(",").map(s=>s.trim()).filter(Boolean),author:state.user.name};
 state.loadouts.push(loadout); save(); renderOpDetail();
}
function vote(id,val){
 if(!state.user){alert("Sign in first");return;}
 const key=id+"_"+state.user.id; if(state.votes[key])return;
 state.votes[id]=(state.votes[id]||0)+val; state.votes[key]=val; save(); renderOpDetail();
}
function renderMy(){
 const container=document.getElementById("myList"); if(!state.user){container.innerHTML=`<div class="hint">Sign in to see your loadouts</div>`;return;}
 const my=state.loadouts.filter(l=>l.author===state.user.name);
 if(my.length===0){container.innerHTML=`<div class="hint">No loadouts yet</div>`;return;}
 container.innerHTML=my.map(l=>`<div class="card"><strong>${OPS.find(o=>o.id===l.operatorId)?.name}</strong> — ${l.primary} / ${l.secondary||"—"}<div class="hint">${l.gadgets.join(", ")}</div></div>`).join("");
}
function doRecommend(){
 const team=(document.getElementById("teamInput").value||"").split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
 const role=document.getElementById("roleSel").value;
 let candidates=OPS.filter(o=>!team.includes(o.id)&&( !role||o.role===role));
 const rec=candidates.slice(0,5);
 document.getElementById("recResults").innerHTML=rec.map(o=>`<div class="card"><strong>${o.name}</strong> <span class="tag">${o.role}</span><div class="hint">${o.primary} / ${o.secondary||"—"}</div><button onclick="selectOp('${o.id}')">Select</button></div>`).join("");
}
function selectOp(id){selectedOpId=id;document.querySelector(".tab[data-tab='loadouts']").click();}
renderAuth();renderApp();
</script></body></html>
